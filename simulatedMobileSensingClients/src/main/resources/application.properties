spring.application.name=simulatedMobileSensingClients

# Do not start web server, as this is not needed for the crowd monitoring system
# Source: https://docs.spring.io/spring-boot/how-to/webserver.html
spring.main.web-application-type=NONE

# Specify connection parameters for RabbitMQ
# These are taken from the environment variables passed to the docker container of the simulated mobile sensing client
# Source: https://docs.spring.io/spring-boot/reference/messaging/amqp.html
spring.rabbitmq.host=${RABBIT_MQ_HOST}
spring.rabbitmq.port=${RABBIT_MQ_PORT}
spring.rabbitmq.username=${RABBIT_MQ_USERNAME}
spring.rabbitmq.password=${RABBIT_MQ_PASSWORD}