# Source: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowd-monitoring-server-deployment
spec:
  selector:
    matchLabels:
      app: crowd-monitoring-server
  # Three instances of the crowd monitoring server will be deployed
  replicas: 3
  template:
    metadata:
      labels:
        app: crowd-monitoring-server
    spec:
      containers:
        - image: ghcr.io/leopoldblk/server:v0.2.0
          name: crowd-monitoring-server
          # Define connection parameters to the RabbitMQ cluster as environment variables for the container
          # These are used within the containerized Spring Boot application to connect to the RabbitMQ cluster deployed to Kubernetes
          # Source: https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/
          env:
            - name: RABBIT_MQ_HOST
              value: ""
            - name: RABBIT_MQ_PORT
              value: ""
            - name: RABBIT_MQ_USERNAME
              value: ""
            - name: RABBIT_MQ_PASSWORD
              value: ""